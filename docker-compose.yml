version: '3.8'

services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: curalink-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: curalink-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/curalink
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - EMBEDDING_PROVIDER=local
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./server/artifacts:/app/artifacts

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: curalink-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

  ollama:
    image: ollama/ollama:latest
    container_name: curalink-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  mongo-data:
  ollama-models:
